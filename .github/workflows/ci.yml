name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — verified GitHub tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 — verified GitHub tag
        with:
          node-version: ${{ matrix.node }}
      - name: Checkout approved Schema source for publisher-side build only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 — verified GitHub tag
        with:
          repository: atlashub-digital/amf-content-schema
          ref: 5e4381ee896c8e468aeba876120d7816dcb63fcc
          path: .ci/content-schema
      - name: Build isolated Schema artifact
        working-directory: .ci/content-schema
        run: |
          npm install --ignore-scripts
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/.artifacts"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/.artifacts"
      - name: Install Core tooling with the built Schema artifact
        run: npm install --ignore-scripts --no-save --package-lock=false "$GITHUB_WORKSPACE/.artifacts/atlashub-digital-amf-content-schema-0.2.0.tgz"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:artifact
      - run: npm run verify:artifact
        env:
          AMF_SCHEMA_ARTIFACT: ${{ github.workspace }}/.artifacts/atlashub-digital-amf-content-schema-0.2.0.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 — verified GitHub tag
        with:
          name: amf-experience-core-artifact-node-${{ matrix.node }}
          path: |
            .artifacts/atlashub-digital-amf-experience-core-*.tgz
            .artifacts/atlashub-digital-amf-experience-core-*.tgz.sha256
            .artifacts/core-artifact.json
