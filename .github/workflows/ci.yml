name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Checkout approved Schema source for publisher-side build only
        uses: actions/checkout@v4
        with:
          repository: atlashub-digital/amf-content-schema
          ref: 3cf56c55821cb9645578382ad0873078fea883c4
          path: .ci/content-schema
      - name: Build isolated Schema artifact
        working-directory: .ci/content-schema
        run: |
          npm install --ignore-scripts
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/.artifacts"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/.artifacts"
      - name: Install Core tooling with the built Schema artifact
        run: npm install --ignore-scripts --no-save --package-lock=false "$GITHUB_WORKSPACE/.artifacts/atlashub-amf-content-schema-0.2.0.tgz"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:artifact
      - run: npm run verify:artifact
        env:
          AMF_SCHEMA_ARTIFACT: ${{ github.workspace }}/.artifacts/atlashub-amf-content-schema-0.2.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: amf-experience-core-0.2.0-node-${{ matrix.node }}
          path: |
            .artifacts/atlashub-amf-experience-core-0.2.0.tgz
            .artifacts/atlashub-amf-experience-core-0.2.0.tgz.sha256
            .artifacts/core-artifact.json
